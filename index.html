<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Call</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --text:#1b1f2a; --muted:#677084;
    --accent:#2563eb; --accent-text:#ffffff; --border:#e1e4ec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1218; --card:#181c25; --text:#eef0f5; --muted:#98a1b3; --accent:#3b82f6; --border:#2a3040; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:440px}
  h1{margin:0 0 6px;font-size:1.5rem}
  p{color:var(--muted);margin:0 0 22px;line-height:1.5}
  label{display:block;font-size:.85rem;margin-bottom:6px;color:var(--muted)}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
        background:transparent;color:var(--text);font-size:1rem;margin-bottom:16px}
  button{width:100%;padding:13px;border:0;border-radius:10px;font-size:1rem;font-weight:600;
         cursor:pointer;background:var(--accent);color:var(--accent-text);margin-bottom:10px}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
  .link{word-break:break-all;font-size:.9rem;padding:12px;border-radius:10px;
        border:1px dashed var(--border);margin-bottom:12px}
  .hidden{display:none}
  .note{font-size:.8rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="card">

  <!-- HOST VIEW: you create a call and copy the link for your client -->
  <div id="hostView">
    <h1 id="title1"></h1>
    <p>Create a private call link and send it to your client.</p>
    <label for="clientName">Client name (optional)</label>
    <input id="clientName" placeholder="e.g. John" autocomplete="off">
    <button id="createBtn">Create call link</button>

    <div id="result" class="hidden">
      <label>Send this link to your client</label>
      <div class="link" id="linkText"></div>
      <button id="copyBtn" class="secondary">Copy link</button>
      <button id="startBtn">Start the call now</button>
    </div>
    <div class="note">The call opens in a new tab. Keep the link private, anyone with it can join.</div>
  </div>

  <!-- CLIENT VIEW: shown when the link has ?room=... -->
  <div id="clientView" class="hidden">
    <h1 id="title2"></h1>
    <p>Your call is ready. Tap the button to join with your camera and mic.</p>
    <button id="joinBtn">Join call</button>
    <div class="note">If asked, allow camera and microphone access in your browser.</div>
  </div>

</div>

<script>
  // ====== EDIT THIS ======
  const BUSINESS_NAME = "My Business";
  // =======================

  document.getElementById("title1").textContent = BUSINESS_NAME;
  document.getElementById("title2").textContent = BUSINESS_NAME;
  document.title = BUSINESS_NAME + " - Call";

  const params = new URLSearchParams(location.search);
  const room = params.get("room");

  function jitsiUrl(r){
    return "https://meet.jit.si/" + encodeURIComponent(r) + "#config.prejoinPageEnabled=true";
  }

  function randomId(){
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    const a = new Uint8Array(12);
    crypto.getRandomValues(a);
    return Array.from(a, n => chars[n % chars.length]).join("");
  }

  function slug(s){
    return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 20);
  }

  if (room) {
    document.getElementById("clientView").classList.remove("hidden");
    document.getElementById("joinBtn").onclick = () => { location.href = jitsiUrl(room); };
  } else {
    document.getElementById("hostView").classList.remove("hidden");
    let currentRoom = "", currentLink = "";

    document.getElementById("createBtn").onclick = () => {
      const name = slug(document.getElementById("clientName").value);
      currentRoom = (BUSINESS_NAME ? slug(BUSINESS_NAME) + "-" : "") + (name ? name + "-" : "") + randomId();
      currentLink = location.origin + location.pathname + "?room=" + encodeURIComponent(currentRoom);
      document.getElementById("linkText").textContent = currentLink;
      document.getElementById("result").classList.remove("hidden");
    };

    document.getElementById("copyBtn").onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(currentLink);
        e.target.textContent = "Copied!";
      } catch {
        e.target.textContent = "Copy failed, select the link manually";
      }
      setTimeout(() => e.target.textContent = "Copy link", 2000);
    };

    document.getElementById("startBtn").onclick = () => {
      window.open(jitsiUrl(currentRoom), "_blank", "noopener");
    };
  }
</script>
</body>
</html>
